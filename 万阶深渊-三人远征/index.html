<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070a11">
  <title>万阶深渊：三人远征</title>
  <meta name="description" content="火炬不灭，远征不止。挑战10000关地下城的自动战斗放置RPG。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="game-shell">
    <header class="topbar panel-surface">
      <div class="brand-block">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <div><h1>万阶深渊</h1><p>三人远征 · 火炬不灭，远征不止</p></div>
      </div>

      <div class="depth-header" aria-label="远征进度">
        <div class="depth-title"><span id="zoneIndex">区域 01</span><strong id="zoneName">苔痕地窟</strong><b id="stageValue">1 / 10000</b></div>
        <div class="depth-track"><div id="milestoneBar"></div><i class="depth-marker marker-25"></i><i class="depth-marker marker-50"></i><i class="depth-marker marker-75"></i></div>
        <div class="depth-caption"><span id="milestoneTitle">第100关 · 篝火重整</span><span id="milestoneText">再推进99关解锁重生。</span></div>
      </div>

      <div class="top-actions">
        <div class="resource-strip" aria-label="资源">
          <div class="resource gold"><span>金币</span><strong id="goldValue">0</strong></div>
          <div class="resource dust"><span>粉尘</span><strong id="dustValue">0</strong></div>
          <div class="resource ember"><span>余烬</span><strong id="emberValue">0</strong></div>
        </div>
        <div class="speed-group" aria-label="战斗速度">
          <button class="speed-btn active" data-speed="1">1×</button>
          <button class="speed-btn locked" data-speed="2">2×</button>
          <button class="speed-btn locked" data-speed="4">4×</button>
        </div>
      </div>
    </header>

    <main class="stage-layout">
      <section class="battle-column" aria-label="地下城战斗">
        <div id="battlefield" class="battlefield zone-1">
          <div class="dungeon-depth"></div>
          <div class="ambient-layer" aria-hidden="true"></div>
          <div class="torch torch-left"></div><div class="torch torch-right"></div>

          <div class="stage-heading">
            <span id="eliteMark"></span><span id="bossMark"></span>
          </div>

          <div id="partySprites" class="party-sprites"></div>
          <div id="enemyUnit" class="enemy-unit">
            <div id="enemySprite" class="enemy-sprite"></div>
            <div class="enemy-shadow"></div>
          </div>

          <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>
          <div id="damageLayer" class="damage-layer" aria-live="polite"></div>

          <div class="enemy-hud glass-surface">
            <div class="enemy-title-row"><strong id="enemyName">洞穴黏怪</strong><span id="timerValue">12.0s</span></div>
            <div class="hp-track"><div id="enemyHpBar" class="hp-fill enemy-hp"></div></div>
            <div class="enemy-meta"><span id="enemyHpText">100 / 100</span><span id="enemyTraits">普通</span></div>
          </div>

          <button id="bossBadge" class="boss-badge glass-surface" type="button" aria-label="下一位Boss信息">
            <div class="boss-portrait" id="bossPortrait"></div>
            <div class="boss-badge-copy"><small>下一位守关者 · <b id="nextBossStage">第100关</b></small><strong id="nextBossName">苔岩巨魔 · 初生体</strong><span id="retryText">尚未遭遇</span></div>
            <div class="boss-expand">
              <p id="nextBossDesc">盘踞在潮湿石窟中的远古巨兽。</p>
              <div class="drop-slots" id="dropPreview"></div>
              <span id="bossWinChance" class="win-chance">预计胜率 · 计算中</span>
            </div>
          </button>
          <button id="challengeBtn" class="challenge-btn" disabled>立即挑战</button>

          <div class="combat-metrics glass-surface">
            <div><span>近30秒伤害</span><strong id="dpsValue">0</strong></div>
            <i></i>
            <div><span>近30秒治疗</span><strong id="healValue">0</strong></div>
          </div>

          <div id="bossIntro" class="boss-intro hidden"><small>深渊领主苏醒</small><strong id="bossTitle">苔岩巨魔 · 初生体</strong></div>
          <div id="victoryOverlay" class="victory-overlay hidden"><span>永恒篝火已点燃</span><h2>万阶远征 · 完成</h2><p>三人的名字已刻入深渊尽头。</p></div>
        </div>
      </section>

      <aside id="sideDrawer" class="side-drawer panel-surface" aria-hidden="true">
        <header class="drawer-header"><div><small>远征整备</small><h2 id="drawerTitle">队伍</h2></div><button id="drawerClose" class="drawer-close" aria-label="关闭面板">×</button></header>
        <div id="tabContent" class="tab-content"></div>
      </aside>
      <div id="drawerScrim" class="drawer-scrim" aria-hidden="true"></div>
    </main>

    <footer class="command-deck panel-surface">
      <div class="party-summary">
        <div class="party-summary-title"><span>远征小队</span><small id="teamPower">战力 0</small></div>
        <div id="heroCards" class="hero-cards"></div>
      </div>

      <div class="quick-actions">
        <button id="upgradeAllBtn" class="primary-btn">全队培养</button>
        <button id="autoTrainBtn" class="ghost-btn locked">自动培养 · 500关解锁</button>
      </div>

      <nav class="tab-nav" aria-label="功能面板">
        <button class="tab-btn" data-tab="team"><i>队</i><span>队伍</span></button>
        <button class="tab-btn" data-tab="gear"><i>装</i><span>装备</span><b id="bagBadge" class="badge hidden">0</b></button>
        <button class="tab-btn" data-tab="talent"><i>赋</i><span>天赋</span></button>
        <button class="tab-btn" data-tab="codex"><i>鉴</i><span>图鉴</span></button>
        <button class="tab-btn" data-tab="rebirth"><i>火</i><span>重整</span></button>
        <button class="tab-btn" data-tab="settings"><i>设</i><span>设置</span></button>
      </nav>
    </footer>
  </div>

  <div id="guideTip" class="guide-tip hidden" aria-live="polite"></div>
  <div id="toastStack" class="toast-stack" aria-live="polite"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card"><button id="modalClose" class="modal-close" aria-label="关闭">×</button><div id="modalBody"></div></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
